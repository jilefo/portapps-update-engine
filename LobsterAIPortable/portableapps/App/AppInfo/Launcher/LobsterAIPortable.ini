; ===========================================================================
; LobsterAIPortable  launcher.ini   构建器：Work\_analysis\build_new_pkgs.py
; ===========================================================================
; 安装监控基线（本包目录 _制作素材\ 内）：
;   安装监控日志：LobsterAIPortable\_制作素材（安装.reg / 文件与注册表日志）
;   安装位置、用户目录、协议关联均按日志逐项确定
;
; 【机制】环境变量重定向 + 顽固路径 Junction 目录联接 + 残留/自启清理
;   - [Environment] 对使用 getenv 的组件生效；
;   - Electron/Chromium 系 app.getPath('appData') 走
;     SHGetKnownFolderPath(FOLDERID_RoamingAppData)，**读注册表 Shell Folders、
;     不看进程环境变量**，故必须由 Custom.nsh 建 Junction 才能真落盘
;     （见 docs\踩坑记录.md「Electron 读注册表忽略环境变量」）；
;   - 退出钩子拆除 Junction（rmdir 不带 /s，只拆链接不删目标），宿主零残留。
; ===========================================================================

[Launch]
ProgramExecutable=LobsterAI\LobsterAI.exe
CommandLineArguments=
WorkingDirectory=%PAL:AppDir%\LobsterAI
RunBefore=
RunAfter=
MinVersion=6.1
MinOS=7

DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false
[Environment]
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp
USERPROFILE=%PAL:DataDir%\settings\user

[Activate]
Registry=true

[RegistryKeys]
lobsterai=HKCU\Software\Classes\lobsterai

[RegistryCleanupIfEmpty]
1=HKCU\Software\Classes\lobsterai

