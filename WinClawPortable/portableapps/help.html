<p>Portable application</p>
<h2>便携说明</h2>
<ul>
<li>所有用户数据写入 <code>Data\</code> 目录，宿主系统零残留。</li>
<li>删除 <code>Data\</code> 目录即恢复初始状态。</li>
<li>整个目录可拷贝到任意盘符/路径（含空格）使用。</li>
</ul>
