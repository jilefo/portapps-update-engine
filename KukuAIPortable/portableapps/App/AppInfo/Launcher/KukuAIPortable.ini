; ===========================================================================
; KukuAIPortable  启动器配置   库库AI 1.6.18（Electron 架构）
; ===========================================================================
; 【机制】环境变量重定向 + AutoUpdate 目录改道
;
; ★ 关键约束（与 Typora/WorkBuddy 同类）：
;   严禁重定向 USERPROFILE —— Electron 的 app.getPath('appData')
;   经 SHGetKnownFolderPath 展开 %USERPROFILE%，指向不存在路径会直接崩溃。
;
; ★ KukuAI 特有：自带 AutoUpdate\（AutoUpdate.exe + config.ini）
;   config.ini 内 IsAutoUpdate=1 且 ConfigFileUrl 指向百度更新服务。
;   便携包内必须关闭自动更新，否则程序会往宿主 %APPDATA%\Baidu\KukuAI
;   写升级缓存，破坏「宿主零残留」。构建时由 disable_updater 处理。
; ===========================================================================

[Launch]
ProgramExecutable=KukuAI\GenFlowPro.exe
CommandLineArguments=
WorkingDirectory=%PAL:AppDir%\KukuAI
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[Activate]
Registry=true