;; ===========================================================================
;; ZoomPortable 7.2.0  launcher.ini
;; ===========================================================================
;; 依据：<旧工作区>/Zoom\Zoom Meetings Installer 日志 - 注册表项目.txt
;;       <旧工作区>/Zoom\Zoom Meetings Installer 日志 - 文件和文件夹.txt
;; 括号内 "行 N" 均指上述日志的原始行号。
;; ===========================================================================

[Launch]
;; 主程序直接指向真程序 bin\Zoom.exe，彻底绕过引导器 Zoom_launcher。
;; 根因（2026-10-15 实测 + 安装日志确证）：
;;   Zoom_launcher 是引导下载器，启动后无论是否已装都会后台下载更新包
;;   （实测下载 Zoom.msi 36.67MB + vcredist + Installer.exe 共 41.8MB）；
;;   未装时更会从 zoom.us 全量下载 268MB。
;;   删除 zUpdater.exe 不足以阻断（下载是 launcher 自身行为，方案A实测证伪）。
;;   而 bin\Zoom.exe 可独立运行，直启 90s 实测零下载（终验脚本
;;   Work\_analysis\_zoom_direct_junction_test.py，三项全 PASS）。
;; 数据重定向：Zoom.exe 用 SHGetFolderPath/KnownFolder API 写宿主
;;   %APPDATA%\Zoom，下方 [Environment] 重定向对其无效（实测泄漏 28.84MB），
;;   故由 Custom.nsh 钩子在启动前建 junction 宿主%APPDATA%\Zoom -> Data，
;;   退出时拆除（复用 WeMeetPortable 的 Junction 宏组）。
ProgramExecutable=Zoom\bin\Zoom.exe
WorkingDirectory=%PAL:AppDir%\Zoom\bin
RunBefore=
RunAfter=
MinVersion=5.0
MinOS=7
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false
[Environment]
;; 日志行 5/6/1038/1039：%APPDATA%\Zoom\data  ← 运行期数据主目录
;;   含 client.config / Zoom.us.ini / viper.ini / *.enc.db / telemetrydata.db
APPDATA=%PAL:DataDir%\settings
;; 日志行 1099/1100/1101：%LOCALAPPDATA%\Zoom\data  ← 表情包与本地资源
;;   （旧模板 AppData\Local\Zoom\data 下有 emoji.json / Emojis / plugin）
LOCALAPPDATA=%PAL:DataDir%\settings\local
;; 日志行 14/320：%LOCALAPPDATA%\D3DSCache  ← 显卡着色器缓存
;;   旧模板已将其纳入 AppData\Local\D3DSCache，此处一并重定向避免写入宿主
;; [2026-10-18 补] 临时目录：此前缺 TEMP/TMP，Zoom 的安装/崩溃转储/日志会
;;   直接写进宿主 %TEMP%（数据保存不对）。与全库其余 38 包保持一致。
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp
USERPROFILE=%PAL:DataDir%\settings\user

[Activate]
Registry=true

[RegistryKeys]
;; ---- 应用配置主键（日志行 244–318，共 75 条）----
;; Zoom 把硬件指纹写入 SystemInfo 子树：Win32_Processor / Win32_VideoController
;; / Win32_ComputerSystem / Win32_PhysicalMemory / NPU_Info / Intel_Processor
zoom=HKCU\Software\Zoom
;; ---- 安装来源标记（日志行 241–243，值 from=RE...）----
zoomumx=HKCU\Software\ZoomUMX
;; ---- Outlook 插件客户端注册（日志行 217–238）----
;; Capabilities\UrlAssociations + Protocols\ZoomPhoneCall + shell\open\command
zoompbx=HKCU\Software\Clients\ZoomPBX
;; ---- 已注册应用列表（日志行 239，值名 ZoomPBX）----
;; 注意：此键为共享键，其他软件也写入。仅登记 ZoomPBX 一项，
;;       RegistryCleanupIfEmpty 只在键为空时清理，不会误删他人数据。
registeredapps=HKCU\Software\RegisteredApplications
;; ---- 协议与文件关联（日志行 319–372）----
;; .zoommtg(319-321) / ZoomLauncher(322-327) / zoommtg(330-335) / zoomus(340-345)
;; / ZoomRecording(350-355) / .zoom(358-359) / ZoomPhoneCall(360-363)
;; / ZoomPbx.zoomphonecall(364-372)
clsid_zoommtg=HKCU\Software\Classes\zoommtg
clsid_zoomus=HKCU\Software\Classes\zoomus
clsid_zoomlauncher=HKCU\Software\Classes\ZoomLauncher
clsid_zoomrecording=HKCU\Software\Classes\ZoomRecording
clsid_zoomphonecall=HKCU\Software\Classes\ZoomPhoneCall
clsid_zoompbx=HKCU\Software\Classes\ZoomPbx.zoomphonecall
clsid_ext_zoom=HKCU\Software\Classes\.zoom
clsid_ext_zoommtg=HKCU\Software\Classes\.zoommtg
clsid_mime=HKCU\Software\Classes\MIME\Database\Content Type\application\x-zoommtg-launcher

[RegistryCleanupIfEmpty]
;; 顺序规则：先深层子键，后父键。
;; 仅列出 RegistryKeys 中实际登记过的键。PAL 只会清理它导入过的键，
;; 列出未登记的父键属无效项，且 HKCU\...\MIME\Database 为多程序共享键，
;; 不应由本软件清理。
1=HKCU\Software\Classes\MIME\Database\Content Type\application\x-zoommtg-launcher
2=HKCU\Software\Classes\.zoom
3=HKCU\Software\Classes\.zoommtg
4=HKCU\Software\Classes\ZoomPbx.zoomphonecall
5=HKCU\Software\Classes\ZoomPhoneCall
6=HKCU\Software\Classes\ZoomRecording
7=HKCU\Software\Classes\ZoomLauncher
8=HKCU\Software\Classes\zoomus
9=HKCU\Software\Classes\zoommtg
10=HKCU\Software\Clients\ZoomPBX
11=HKCU\Software\ZoomUMX
12=HKCU\Software\Zoom
;; 刻意不清理：
;; - HKCU\Software\RegisteredApplications  多软件共享，不应由本软件删除
;; - HKCU\...\MIME\Database                 同上
