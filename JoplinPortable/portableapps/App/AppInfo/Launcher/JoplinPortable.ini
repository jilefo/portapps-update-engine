;; ===========================================================================
;; Joplin Portable 3.7.21  launcher.ini
;; ===========================================================================
;; 架构：Electron（独立笔记应用，非 VS Code 派生）
;;
;; 数据落盘设计（实证：joplin_probe/joplin_probe2，2026-10-15）：
;;   - 主数据（database.sqlite/资源/日志）：--profile 参数直指 Data，零逃逸
;;   - %APPDATA%\Joplin：Chromium 网络层/GPU 缓存无视环境变量重定向
;;     （SHGetKnownFolderPath，QoderCN 同型）→ Custom.nsh Junction 兜底
;;   - ~\.config\joplin-desktop：--profile 已盖住主写入，Junction 兜底防
;;     子进程/旧组件按 homeDir 默认路径写入
;;   - ★ USERPROFILE 严禁重定向（Electron 主进程崩溃，踩坑 4.7）
;; ===========================================================================

[Launch]
ProgramExecutable=Joplin\Joplin.exe
CommandLineArguments=--profile "%PAL:DataDir%\settings\profile"
WorkingDirectory=%PAL:AppDir%\Joplin
RunBefore=
RunAfter=
MinVersion=10.0
MinOS=7

DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
;; ── 数据重定向 ──
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp
;; ★ 禁止重定向 USERPROFILE（SHGetKnownFolderPath 按 %USERPROFILE% 展开
;;   出不存在的路径 → "Failed to get 'appData' path" 主进程崩，踩坑 4.7）

[Activate]
Registry=true

[RegistryKeys]
;; Joplin 安装信息（HKCU\Software\Joplin；若应用未写则为空键，退出自动清理）
joplin=HKCU\Software\Joplin

[RegistryCleanupIfEmpty]
;; 顺序：深层子键 → 父键
1=HKCU\Software\Joplin
