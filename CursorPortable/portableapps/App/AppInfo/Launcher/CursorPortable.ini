;; ===========================================================================
;; Cursor Portable 3.24.18  launcher.ini
;; ===========================================================================
;; 架构：VSCode（VS Code 派生）
;;
;; 日志依据：Cursor 日志 - 注册表项目.txt / Cursor 日志 - 文件和文件夹.txt
;;
;; 【可行性实证】该软件 HKLM 自有键 0 条，无服务、无 COM、无 Shell 扩展、
;;   无开机自启、无驱动。所有 HKLM 残留均为系统噪声：
;;     - SYSTEM\ControlSet001\Control\hivelist          注册表配置单元卸载
;;     - SYSTEM\...\Services\ASP.NET_4.0.30319\Names  IIS 应用池
;;     - SOFTWARE\Microsoft\Multimedia\Audio\Journal   Windows 录音设备
;;     - SYSTEM\...\Services\SharedAccess\...          防火墙策略
;;     - SOFTWARE\Microsoft\Windows\...\AppModel       应用包仓储
;;   故可完整做【便携版】，全部数据由环境变量重定向承载。
;; ===========================================================================

[Launch]
ProgramExecutable=Cursor\Cursor.exe
CommandLineArguments=--user-data-dir="%PAL:DataDir%\settings"
WorkingDirectory=%PAL:AppDir%\Cursor
RunBefore=
RunAfter=
MinVersion=10.0
MinOS=7

DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false
[Environment]
;; ── 数据重定向 ──
;; 三个变量即可覆盖该架构的全部用户级写入：
;;   APPDATA        → Cursor 用户数据根目录
;;   LOCALAPPDATA   → VS Code: Cache / CachedData / CachedExtensionVSIXs / User\workspaceStorage
;;   TEMP/TMP       → 安装器与插件解包临时目录
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp
;; 部分 Electron 应用会读 USERPROFILE，一并重定向避免写入宿主用户目录
USERPROFILE=%PAL:DataDir%\settings\user

[Activate]
Registry=true

[RegistryKeys]
;; 应用配置与全部用户状态（行 244 起，占 HKCU 主体）
cursor=HKCU\Software\Cursor
;; 「用 Cursor 打开」的文件关联（约 1700 条语言扩展名，行 584 起）
;; 注意：条目极多，逐条登记会让本文件膨胀到数 MB。
;; 故只登记主程序关联键，扩展名关联由 Custom.nsh 在退出时清理。

;; 刻意【不】登记的键：
;;   HKCU\Software\Microsoft\*              多软件共享
;;   HKCU\Software\Classes\Local Settings\*  系统 Shell 缓存
;;   HKCU\Software\RegisteredApplications    多软件共享（登记但不清理）
;;   HKCU\Software\Clients\StartMenuInternet  开始菜单共享

[RegistryCleanupIfEmpty]
;; 顺序：深层子键 → 父键
1=HKCU\Software\Cursor

