; ===========================================================================
; QQPortable  启动器配置   构建器：Work\_analysis\build_dual5.py
; ===========================================================================
; 【机制】环境变量重定向 + Junction 目录联接（详见 Custom.nsh 头注释）
; ★ 严禁重定向 USERPROFILE —— Electron 的 app.getPath('appData') 经
;   SHGetKnownFolderPath 展开 %USERPROFILE% 得到不存在路径会直接崩溃
;   （docs\踩坑记录.md「USERPROFILE 崩溃机理」实证）。
; ===========================================================================

[Launch]
ProgramExecutable=QQ\Bin\QQ.exe
CommandLineArguments=
WorkingDirectory=%PAL:AppDir%\QQ\Bin
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[FilesMove]
settings\Bin_beacon_report.log=%PAL:AppDir%\QQ\Bin

[RegistryKeys]
qq=HKCU\Software\Tencent\QQ
qq2009=HKCU\Software\Tencent\QQ2009
qqguild=HKCU\Software\Tencent\QQGuild
bugreport=HKCU\Software\Tencent\bugReport
report=HKCU\Software\Tencent\Report

[Activate]
Registry=true
