;; ===========================================================================
;; 腾讯会议 WeMeetPortable 3.46.11.413  launcher.ini  【绿色版】
;; ===========================================================================
;; 依据：<旧工作区>/WeMeet\WeMeet 日志 - 注册表项目.txt
;;       <旧工作区>/WeMeet\WeMeet 日志 - 文件和文件夹.txt
;; 括号内 "行 N" 均指上述日志的原始行号。
;;
;; 【绿色版核心策略】
;;   FuncOnStart  : 把便携目录的绝对路径写入 HKLM 版本指针（WeMeetApp 启动必需）
;;   FuncOnExit   : 彻底删除该 HKLM 键，做到运行结束后系统无持久痕迹
;;
;; 【为什么不登记服务与 COM】
;;   日志行 329-339 的 WemeetUpdateSvc（自动更新服务）与行 212-246 的
;;   CLSID/TypeLib/Interface/AppID（COM）均只服务于「自动更新」与
;;   「Outlook 插件 / 第三方登录协议」，核心会议功能不依赖。
;;   故一律不注册，从根本上避免系统残留。
;; ===========================================================================

[Launch]
;; 主程序。与 3.46.11.413 版本目录为【同级兄弟】关系，不可拍平。
;; 日志行 6560：<本机工具目录>/WeMeet\WeMeetApp.exe  已创建
;; 二进制内嵌 "3.46.11.413" 字符串，且按 wemeetapp_path / wemeetapp_sub
;; 定位同级的版本目录，故 WorkingDirectory 固定为 WeMeet 目录。
ProgramExecutable=WeMeet\WeMeetApp.exe
WorkingDirectory=%PAL:AppDir%\WeMeet
RunBefore=
RunAfter=
MinVersion=6.1
MinOS=7

DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false
[Environment]
;; 日志行 18  ：%APPDATA%\Tencent\WeMeet\check_delete_permission
;; 日志行 6587：%APPDATA%\Tencent\WeMeet\Global\Upgrade   （更新暂存）
;; 日志行 6708：%APPDATA%\Tencent\WeMeet\Global\Logs
;; 二进制内确认引用 APPDATA / LOCALAPPDATA / TEMP 三个变量
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
;; 日志中 TEMP 出现于 %USERPROFILE%\AppData\Local\Temp（行 6/9），
;; 重定向到 Data 避免安装/解压残留落入宿主 Temp
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[Activate]
Registry=true

[RegistryKeys]
;; ---- 用户级：运行期可安全映射，退出自动清理 ----
;; 日志行 586-588：HKCU\SOFTWARE\WeChatAppEx\{BLBeacon, ThirdParty}
;;   微信/企业微信共用组件的埋点状态，非会议功能所需，但一并映射以减少差异
wechappex=HKCU\Software\WeChatAppEx
wechappex_beacon=HKCU\Software\WeChatAppEx\BLBeacon
wechappex_3rd=HKCU\Software\WeChatAppEx\ThirdParty
;; 日志行 580：HKCU\SOFTWARE\Microsoft\Windows Error Reporting\
;;   RuntimeExceptionHelperModules → <本机工具目录>/WeMeet\3.46.11.413\bugly_extra_handler.dll
;;   该值含安装时绝对路径，导入后需由 Custom.nsh 改写为便携目录路径，
;;   否则换盘符后崩溃上报模块失效（不影响会议功能）
wermodules=HKCU\Software\Microsoft\Windows Error Reporting\RuntimeExceptionHelperModules

[RegistryCleanupIfEmpty]
;; 用户级键，退出后清理。顺序：深层子键 → 父键
1=HKCU\Software\WeChatAppEx\BLBeacon
2=HKCU\Software\WeChatAppEx\ThirdParty
3=HKCU\Software\WeChatAppEx
4=HKCU\Software\Microsoft\Windows Error Reporting\RuntimeExceptionHelperModules

;; ---------------------------------------------------------------------------
;; 【2026-10-15 二次修复】弃用 FilesMove，改 Junction 目录联接（Custom.nsh 实现）
;;
;; FilesMove 实测缺陷：便携包在 D 盘、宿主 APPDATA 在 C 盘，跨卷时 PAL 的
;;   FilesMove 退化为【复制】（Data 侧源完整保留），退出时"搬回"因 Data 侧
;;   已有同名目录而静默失败 —— 宿主残留、本次会话数据变更丢失。
;;
;; Junction 方案：启动时在宿主 %APPDATA%\Tencent\WeMeet 建目录联接指向
;;   Data\settings\Tencent\WeMeet，退出时删除联接（rmdir 不带 /s，只删链接
;;   不删目标）。数据物理上始终只存在于 Data，宿主路径仅是指针：
;;   零搬运、跨卷无感、无搬回失败风险。全部逻辑见 Custom.nsh。
;;
;; 注意：绝不联接共享/他软件目录（Marvis 属 <本机工具目录>/Marvis 独立套件；
;;   beacon/BeaconConfig/DtConfig 为腾讯系共享埋点缓存）。
;; ---------------------------------------------------------------------------

;; 刻意【不】登记的键及原因：
;;
;; 1) HKLM\SOFTWARE\Tencent\WeMeet  （行 283-294）
;;    含 InstallRootDir / Dependence / NewInstallSubPath / Version。
;;    WeMeetApp.exe 在二进制中查询 "Dependence" 值来定位版本目录，
;;    查不到会报 "query version Dependence error"，故启动前必须临时写入。
;;    但这是 HKLM 写入 —— 由 Custom.nsh 的 FuncOnStart 负责，
;;    PAL 的 RegistryKeys 机制【无法】写 HKLM，故不在此登记。
;;    退出时由 FuncOnExit 彻底删除。
;;
;; 2) HKLM\SOFTWARE\WOW6432Node\Tencent\WeMeet （行 293-294）
;;    32 位兼容镜像，随 1) 一并由 Custom.nsh 写入与清除。
;;
;; 3) HKLM\SYSTEM\ControlSet001\Services\WemeetUpdateSvc （行 329-339）
;;    自动更新服务（LocalSystem 权限）。已主动放弃自动更新，
;;    不注册。相关可执行文件 update_lib.dll / package_update.dll /
;;    DeltaUpgradeHelper.exe 已从便携包中移除。
;;
;; 4) HKLM\SOFTWARE\Classes\WOW6432Node\CLSID\{968b7869-...}\LocalServer32
;;    及其 TypeLib / Interface / AppID （行 207-246）
;;    COM 本地服务器，服务于 Outlook 加载项。PAL 无法注册 DCOM，
;;    且注册后必然残留，故放弃该功能。
;;
;; 5) HKLM\SOFTWARE\Classes\wemeet / wemeet3 / wwauth3rd* / .wemt*
;;    协议与文件关联（行 157-206、247-282）
;;    全部指向 "<本机工具目录>/WeMeet\WeMeetApp.exe" 绝对路径。
;;    换盘符后必然失效，且属 HKLM 写入。放弃系统级协议关联。
;;    用户可手动为常用协议指定便携目录下的 WeMeetApp.exe。
;;
;; 6) HKCU\...\CurrentVersion\Run\WeMeetApp （行 579）
;;    自启项。Custom.nsh 在启动前与退出后各清理一次。
