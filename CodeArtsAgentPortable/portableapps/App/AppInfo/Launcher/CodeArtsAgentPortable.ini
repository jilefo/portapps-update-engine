;; ===========================================================================
;; CodeArts Agent Portable 26.9.901  launcher.ini
;; ===========================================================================
;; 架构：Chromium / Electron 派生
;;
;; 【可行性实证】Total Uninstall 日志过滤系统噪声后，HKLM 自有键为 0，
;;   无自有服务、无自有 COM、无 Shell 扩展、无开机自启、无驱动。
;;   日志中出现的 HKLM 条目均为系统噪声或硬件驱动注册：
;;     - SYSTEM\ControlSet001\Control\hivelist      注册表配置单元卸载
;;     - Services\ClipSVC                            Windows 剪贴板服务
;;     - Services\cphs / cplspcon                    Intel CPU / 显卡驱动
;;     - SOFTWARE\Classes\CLSID (硬件)                显卡驱动 COM
;;     - SOFTWARE\Microsoft\DirectX / Wbem           图形与设备枚举
;;     - Multimedia\Audio\Journal                    Windows 录音设备
;;   故可完整做【便携版】，全部数据由环境变量重定向承载。
;; ===========================================================================

[Launch]
DirectoryMoveOK=yes
ProgramExecutable=CodeArts Agent\codearts-agent.exe
WorkingDirectory=%PAL:AppDir%\CodeArts Agent
RunBefore=
RunAfter=
MinVersion=10.0

[Environment]
;; ── 数据重定向 ──
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp
USERPROFILE=%PAL:DataDir%\settings\user
;; 缓存内容：Chromium/Electron: Cache / Code Cache / GPUCache / Local Storage

[Activate]
Registry=true

[RegistryKeys]
;; 应用配置与用户状态
app=HKCU\Software\CodeArts Agent

[RegistryCleanupIfEmpty]
;; 顺序：深层子键 → 父键
1=HKCU\Software\CodeArts Agent
