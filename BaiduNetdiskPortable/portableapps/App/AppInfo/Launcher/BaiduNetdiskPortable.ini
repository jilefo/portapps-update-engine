; ===========================================================================
; BaiduNetdiskPortable  启动器配置   构建器：Work\_analysis\build_dual5.py
; ===========================================================================
; 【机制】环境变量重定向 + Junction 目录联接（详见 Custom.nsh 头注释）
; ★ 严禁重定向 USERPROFILE —— Electron 的 app.getPath('appData') 经
;   SHGetKnownFolderPath 展开 %USERPROFILE% 得到不存在路径会直接崩溃
;   （docs\踩坑记录.md「USERPROFILE 崩溃机理」实证）。
; ===========================================================================

[Launch]
ProgramExecutable=BaiduNetdisk\BaiduNetdisk.exe
CommandLineArguments=
WorkingDirectory=%PAL:AppDir%\BaiduNetdisk
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[FilesMove]
settings\BaiduRoot\AppConfig.ini=%PAL:AppDir%\BaiduNetdisk
settings\BaiduRoot\AppSettingApp.dat=%PAL:AppDir%\BaiduNetdisk
settings\AutoUpdate\config.ini=%PAL:AppDir%\BaiduNetdisk\AutoUpdate
settings\BrowserEngine\AppConfig.ini=%PAL:AppDir%\BaiduNetdisk\module\BrowserEngine
settings\BrowserEngine\AppSettingApp.dat=%PAL:AppDir%\BaiduNetdisk\module\BrowserEngine
settings\BrowserEngineCrash\settings.dat=%PAL:AppDir%\BaiduNetdisk\module\BrowserEngine\plugin crash logs

[DirectoriesMove]
settings\users=%PAL:AppDir%\BaiduNetdisk\users
settings\AutoUpdateDownload=%PAL:AppDir%\BaiduNetdisk\AutoUpdate\Download

[RegistryKeys]
baidu=HKCU\Software\Baidu

[Activate]
Registry=true
