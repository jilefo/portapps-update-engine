; ===========================================================================
; PresentationPortable（WPS 演示）  启动器配置（分体组件）
; ===========================================================================
; 由核查工具生成：PAL 启动器运行时以 $BaseName 读取本文件，
; 原 dist 树 Launcher 目录为空导致 4 个分体启动器无 ProgramExecutable、
; ExecWait 立即返回造成"静默退出"。本文件按 appinfo.ini [Control]
; 与 WPSOfficePortable.ini 注释中的作者映射补齐。
; ===========================================================================

[Launch]
ProgramExecutable=office6\wpp.exe
;; 2026-10-18 修复：无参会落「首页壳」（KxWppPromeMainWindow，标题
;; 「WPS演示」但显示的是首页仪表盘）；/nostartpage 实测直开空白演示
;; 文档（标题「WPS 演示」，UIA 验证首页控件消失）。
CommandLineArguments=/nostartpage
WorkingDirectory=%PAL:AppDir%\office6
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
;; ── 数据重定向：四组件共享套件级配置 ──
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[Activate]
Registry=true

[RegistryKeys]
;; WPS 套件配置
app=HKCU\Software\Kingsoft\Office
