; ===========================================================================
; WPSOfficePortable（WPS Office 综合入口） —— PAL 启动器配置
; ===========================================================================
; 说明：PAL 运行期按 $BaseName（启动器 exe 名）拼配置文件路径
;   $EXEDIR\App\AppInfo\Launcher\$BaseName.ini
; 本文件此前缺失，导致双击 WPSOfficePortable.exe 报
; 「is missing [Launch]:ProgramExecutable」错误框，主程序不启动。
; 本次补齐（2026-10-17）。主入口启动 WPS 综合程序 wpsoffice.exe。
; ===========================================================================

[Launch]
ProgramExecutable=office6\wpsoffice.exe
CommandLineArguments=
WorkingDirectory=%PAL:AppDir%\office6
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
;; 一体化环境：APPDATA / LOCALAPPDATA / TEMP 全部重定向进包内 Data
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[Activate]
Registry=true

[RegistryKeys]
;; WPS 注册表还原
app=HKCU\Software\Kingsoft\Office
