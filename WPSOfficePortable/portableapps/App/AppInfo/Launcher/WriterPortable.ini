; ===========================================================================
; WriterPortable（WPS 文字）  启动器配置（分体组件）
; ===========================================================================
; 由核查工具生成：PAL 启动器运行时以 $BaseName 读取本文件，
; 原 dist 树 Launcher 目录为空导致 4 个分体启动器无 ProgramExecutable、
; ExecWait 立即返回造成"静默退出"。本文件按 appinfo.ini [Control]
; 与 WPSOfficePortable.ini 注释中的作者映射补齐。
; ===========================================================================

[Launch]
ProgramExecutable=office6\wpsoffice.exe
;; 2026-10-18 修复：wps.exe 无参会打开 WPS 首页（2023 统一架构下首页
;; 寄生于文字模块，标题也叫「WPS文字」，与主入口无法区分）。
;; 实测（UIA 控件树）：任何不带 /nostartpage 的启动都先落「首页壳」
;; （KxWpsPromeMainWindow，含 新建/最近/打开/暂无打开记录 控件）；
;; 加 /nostartpage 后跳过首页壳，直开空白文字文档（标题变「WPS 文字」，
;; UI 文本 5→19，功能区出现）。/wps 选择文字组件，/w 新实例。
CommandLineArguments=/wps /w /nostartpage
WorkingDirectory=%PAL:AppDir%\office6
DirectoryMoveOK=yes
NoSpacesInPath=false
SupportsUNC=yes
SingleAppInstance=false
SinglePortableAppInstance=false

[Environment]
;; ── 数据重定向：四组件共享套件级配置 ──
APPDATA=%PAL:DataDir%\settings
LOCALAPPDATA=%PAL:DataDir%\settings\local
TEMP=%PAL:DataDir%\settings\Temp
TMP=%PAL:DataDir%\settings\Temp

[Activate]
Registry=true

[RegistryKeys]
;; WPS 套件配置
app=HKCU\Software\Kingsoft\Office
